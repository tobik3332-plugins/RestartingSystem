name: Build RestartingSystem

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Calculate Version
        id: version
        run: |
          RUN_NUM=${{ github.run_number }}
          if [ "$RUN_NUM" -eq 1 ]; then
            VERSION="1.0.0"
          elif [ "$RUN_NUM" -lt 10 ]; then
            VERSION="1.0.$RUN_NUM"
          else
            MINOR=$((RUN_NUM / 10))
            PATCH=$((RUN_NUM % 10))
            VERSION="1.${MINOR}.${PATCH}"
          fi
          echo "FINAL_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Vypočítaná verze: $VERSION"

      - name: Build with Maven
        run: mvn clean package -Dproject.version=${{ env.FINAL_VERSION }}

      - name: Rename JAR artifact
        run: |
          mv target/RestartingSystem-${{ env.FINAL_VERSION }}-SNAPSHOT.jar target/RestartingSystem-${{ env.FINAL_VERSION }}.jar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RestartingSystem-${{ env.FINAL_VERSION }}
          path: target/RestartingSystem-${{ env.FINAL_VERSION }}.jar
