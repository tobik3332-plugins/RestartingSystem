# ========================================================
#             RestartSystem Configuration
# ========================================================
# Permise:
# # restarting.admin          - Oprávnění k příkazu /restarting reload
# # restarting.restart        - Oprávnění k zahájení restartu s přednastaveným důvodem
# # restarting.restart.custom - Oprávnění k zahájení restartu s vlastním důvodem (custom)
# # restarting.cancel         - Oprávnění ke zrušení probíhajícího restartu (/restarting cancel)
# ========================================================

example-time:
  - "600"
  - "300"
  - "120"
  - "60"

# Formátování času pro proměnnou {time}
time-formatting:
  seconds:
    one: "1 sekunda"
    few: "{count} sekundy"
    many: "{count} sekund"
  minutes:
    one: "1 minuta"
    few: "{count} minuty"
    many: "{count} minut"
  connector: " a "

announce:
  - "600, Server se restartuje za 10 minut!"
  - "300, Server se restartuje za 5 minut!"
  - "120, Server se restartuje za 2 minuty!"
  - "60, Server se restartuje za 1 minutu!"
  - "10, Server se restartuje za 10 sekund!"
  - "5, Server se restartuje za 5 sekund!"

# Zprávy pro hráče
messages:
  reload-success: "&8[&cRestartSystem&8]&7 Konfigurace byla uspesne reloadovana."
  no-permission: "&cNa toto nemáš právo."
  usage: "&7Pouziti: &c/restarting <cas|reload|cancel> [duvod|custom] [vlastni text]"
  invalid-time: "&cNeplatny cas! Musi byt zadano cislo v sekundach."
  no-reason-provided: "&cMusis zadat duvod restartu!"
  no-custom-text-provided: "&cMusis napsat text vlastniho duvodu!"
  unknown-reason: "&cTento duvod v konfiguraci neexistuje!"
  no-restart-running: "&cZadny restart aktualne neprobiha."

kick-message: "&cServer se prave restartuje!\nPrijdte se podivat za chvili."

# Víceřádková zpráva při zrušení restartu (odesílá se všem)
prompt-cancel:
  prompt:
    - "&8--------------------------------------------------"
    - " &cRestartovani serveru bylo zruseno"
    - "&r"
    - " &cOmlouvame se"
    - "&8--------------------------------------------------"

prompts:
  plugins:
    - "&8-----------------------------------------------------"
    - " &cRestartovani serveru za {time}"
    - "&r"
    - " &cDuvod: Restartovani kvuli pluginum"
    - "&8-----------------------------------------------------"
  udrzba:
    - "&8-----------------------------------------------------"
    - " &cRestartovani serveru za {time}"
    - "&r"
    - " &cDuvod: Planovana udrzba serveru"
    - "&8-----------------------------------------------------"

custom-prompts:
  prompt:
    - "&8-----------------------------------------------------"
    - " &cRestartovani serveru za {time}"
    - "&r"
    - " &cDuvod: {reason}"
    - "&8-----------------------------------------------------"
